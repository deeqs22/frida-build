name: Build Messiah Memory Scanner V2
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Create Code
        run: |
          cat > scanner.cpp << 'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <dirent.h>
          #include <sys/mman.h>

          int get_pid(const char* package) {
              char cmd[256];
              snprintf(cmd, sizeof(cmd), "pidof %s", package);
              FILE* fp = popen(cmd, "r");
              if (!fp) return -1;
              int pid = -1;
              fscanf(fp, "%d", &pid);
              pclose(fp);
              return pid;
          }

          bool is_valid_coord(float f) {
              if (f != f) return false; // NaN
              if (f > 10000.0f || f < -10000.0f) return false;
              return true;
          }

          int main(int argc, char** argv) {
              const char* pkg = "com.netease.newspike";
              int pid = get_pid(pkg);
              if (pid == -1) {
                  printf("[-] Game not running.\n");
                  return 1;
              }
              printf("[+] Found game PID: %d\n", pid);

              char mem_path[64];
              snprintf(mem_path, sizeof(mem_path), "/proc/%d/mem", pid);
              int fd = open(mem_path, O_RDONLY);
              if (fd < 0) { perror("open mem"); return 1; }

              char maps_path[64];
              snprintf(maps_path, sizeof(maps_path), "/proc/%d/maps", pid);
              FILE* maps = fopen(maps_path, "r");
              if (!maps) { perror("open maps"); return 1; }

              char line[512];
              int count = 0;
              
              while (fgets(line, sizeof(line), maps)) {
                  unsigned long start, end;
                  char perms[5];
                  if (sscanf(line, "%lx-%lx %4s", &start, &end, perms) == 3) {
                      if (strcmp(perms, "rw-p") == 0) {
                          size_t size = end - start;
                          if (size < 1024 * 1024) continue; 
                          
                          char* buf = (char*)malloc(size);
                          if (!buf) continue;
                          
                          if (pread(fd, buf, size, start) > 0) {
                              float* floats = (float*)buf;
                              for (size_t i = 0; i < size / sizeof(float) - 3; i++) {
                                  float x = floats[i];
                                  float y = floats[i+1];
                                  float z = floats[i+2];
                                  
                                  if (is_valid_coord(x) && is_valid_coord(y) && is_valid_coord(z)) {
                                      if ((x == 0 && y == 0 && z == 0) || (x == 1 && y == 1 && z == 1)) continue;
                                      
                                      if (count < 100) {
                                          printf("Addr: 0x%lx | X: %f, Y: %f, Z: %f\n", start + i * sizeof(float), x, y, z);
                                          count++;
                                      }
                                  }
                              }
                          }
                          free(buf);
                      }
                  }
              }
              printf("[+] Scan complete. Found %d potential coordinates.\n", count);
              fclose(maps);
              close(fd);
              return 0;
          }
          EOF
      - name: Compile
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ -static-libstdc++ -o scanner scanner.cpp
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanner
          path: scanner
