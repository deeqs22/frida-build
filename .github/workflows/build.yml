name: Build Frida Python Dump
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Frida
        run: pip install frida-tools
      - name: Create Python Script
        run: |
          cat > dump.py << 'EOF'
          import frida
          import time

          js_code = """
          setImmediate(function() {
              console.log("[*] JS loaded. Finding libil2cpp.so...");
              var il2cpp = Process.findModuleByName("libil2cpp.so");
              if (!il2cpp) { console.log("[-] libil2cpp.so not found!"); return; }
              var domain_get = Module.findExportByName("libil2cpp.so", "il2cpp_domain_get");
              if (domain_get) {
                  console.log("[+] il2cpp_domain_get found at " + domain_get);
              }
          });
          """

          def on_message(message, data):
              print("[JS]:", message)

          print("[*] Waiting for device...")
          device = frida.get_usb_device()
          print("[*] Attached to device:", device.name)
          try:
              print("[*] Spawning com.netease.newspike...")
              pid = device.spawn(["com.netease.newspike"])
              session = device.attach(pid)
              script = session.create_script(js_code)
              script.on('message', on_message)
              script.load()
              device.resume(pid)
              time.sleep(10)
          except Exception as e:
              print("[-] Error:", e)
          EOF
      - name: Upload Script
        uses: actions/upload-artifact@v4
        with:
          name: dump_script
          path: dump.py
