name: Build Oxide Mono (Final with Dobby)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Download ImGui & Dobby Header
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git
          git clone --depth 1 https://github.com/jmpews/Dobby.git
      - name: Download Prebuilt Dobby
        run: |
          # Скачиваем готовую библиотеку (чтобы не собирать и не ловить ошибки ассемблера)
          wget https://github.com/jmpews/Dobby/releases/download/v1.0.0/libdobby.a -O libdobby.a || echo "Prebuilt Dobby not found, trying alternative..."
          if [ ! -f libdobby.a ]; then
             # Альтернативная ссылка (если первая мертва)
             wget https://github.com/Perfare/Zygisk-Il2CppDumper/releases/download/v1.6.1/libdobby.a -O libdobby.a || echo "Alternative failed too"
          fi
          if [ -f libdobby.a ]; then echo "Dobby downloaded successfully"; else echo "No Dobby, will use stubs"; fi
      - name: Create Source
        run: |
          cat > main.cpp << 'EOF'
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <android/log.h>
          #include <dlfcn.h>
          #include <pthread.h>
          #include <unistd.h>
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          
          // Если Dobby не скачалась, используем заглушку
          #ifdef USE_DOBBY
          #include "dobby.h"
          #else
          extern "C" int DobbyHook(void *address, void *fake_func, void **out_origin_func) { return 0; }
          #endif
          
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "oxide_mono", __VA_ARGS__)
          
          // --- IMGUI ---
          static bool g_menu_open = true;
          void init_imgui() {
              ImGui::CreateContext(); ImGui::GetIO().IniFilename = NULL; ImGui_ImplOpenGL3_Init("#version 300 es");
              ImGui::GetStyle().WindowRounding = 15.0f;
              ImGui::GetStyle().Colors[ImGuiCol_WindowBg] = ImVec4(0.02f, 0.02f, 0.02f, 1.0f);
              ImGui::GetStyle().Colors[ImGuiCol_Border] = ImVec4(1.0f, 0.2f, 0.2f, 1.0f);
          }
          void render_menu() {
              if (!g_menu_open) return;
              ImGui_ImplOpenGL3_NewFrame(); ImGui::NewFrame();
              ImGui::SetNextWindowSize(ImVec2(380, 500), ImGuiCond_FirstUseEver);
              ImGui::Begin("OXIDE MENU", &g_menu_open);
              ImGui::TextColored(ImVec4(0.2f, 0.6f, 1.0f, 1.0f), "t.me/game_soft_svk");
              ImGui::Text("Status: Premium");
              ImGui::End(); ImGui::Render(); ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          }
          
          using EglSwapFn = EGLBoolean(*)(EGLDisplay, EGLSurface); static EglSwapFn orig_swap = nullptr;
          EGLBoolean hk_eglSwapBuffers(EGLDisplay dpy, EGLSurface surf) { render_menu(); return orig_swap(dpy, surf); }
          
          void* thread_main(void*) {
              sleep(8); // Ждем загрузки
              init_imgui();
              
              void* libegl = dlopen("libEGL.so", RTLD_NOW);
              if (libegl) {
                  void* egl_swap = dlsym(libegl, "eglSwapBuffers");
                  if (egl_swap) {
                      DobbyHook(egl_swap, (void*)hk_eglSwapBuffers, (void**)&orig_swap);
                      LOGI("EGL hooked!");
                  } else {
                      LOGI("Failed to find eglSwapBuffers");
                  }
              } else {
                  LOGI("Failed to load libEGL.so");
              }
              return nullptr;
          }
          
          extern "C" __attribute__((visibility("default"))) void overlay_entry() {
              pthread_t t; pthread_create(&t, nullptr, thread_main, nullptr); pthread_detach(t);
          }
          EOF
          
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(oxide_mono CXX)
          set(CMAKE_CXX_STANDARD 17)
          include_directories(${CMAKE_SOURCE_DIR}/imgui ${CMAKE_SOURCE_DIR}/imgui/backends ${CMAKE_SOURCE_DIR}/Dobby/include)
          set(CMAKE_CXX_VISIBILITY_PRESET default)
          set(CMAKE_VISIBILITY_INLINES_HIDDEN OFF)
          add_library(oxide_mono SHARED main.cpp
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/backends/imgui_impl_opengl3.cpp)
          
          # Если libdobby.a есть, линкуем её
          if(EXISTS "${CMAKE_SOURCE_DIR}/libdobby.a")
              target_compile_definitions(oxide_mono PRIVATE USE_DOBBY)
              target_link_libraries(oxide_mono log EGL GLESv3 android dl ${CMAKE_SOURCE_DIR}/libdobby.a)
          else()
              target_link_libraries(oxide_mono log EGL GLESv3 android dl)
          endif()
          
          target_compile_options(oxide_mono PRIVATE -O3 -s)
          EOF
          
      - name: Compile
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release ..
          make -j4
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboxide_mono
          path: build/liboxide_mono.so
