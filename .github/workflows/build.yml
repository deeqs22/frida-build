name: Build Oxide Mono (Custom Hook Fixed)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Download ImGui
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git
      - name: Create Source
        run: |
          cat > main.cpp << 'EOF'
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <android/log.h>
          #include <dlfcn.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <string.h>
          #include <stdint.h>
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "oxide_mono", __VA_ARGS__)
          
          // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ДЛЯ ХУКА ---
          static void* g_target = nullptr;
          static uint8_t g_original[16];
          static uint8_t g_patch[16];
          static bool g_installed = false;
          
          bool install_hook(void* target, void* detour) {
              if (!target || !detour) return false;
              g_target = target;
              
              // Делаем страницу доступной для записи
              uintptr_t page = (uintptr_t)target & ~0xFFF;
              if (mprotect((void*)page, 0x1000, PROT_READ | PROT_WRITE | PROT_EXEC) != 0) {
                  LOGI("mprotect failed");
                  return false;
              }
              
              // Сохраняем оригинальные байты (первые 16 байт)
              memcpy(g_original, target, 16);
              
              // Формируем прыжок: LDR X16, #8; BR X16; <адрес>
              uint32_t* code = (uint32_t*)g_patch;
              code[0] = 0x58000050; // LDR X16, #8
              code[1] = 0xD61F0200; // BR X16
              *(uint64_t*)&code[2] = (uint64_t)detour; // Адрес нашей функции
              
              // Записываем патч
              memcpy(target, g_patch, 16);
              
              // Восстанавливаем права
              mprotect((void*)page, 0x1000, PROT_READ | PROT_EXEC);
              g_installed = true;
              return true;
          }
          
          void uninstall_hook() {
              if (!g_target || !g_installed) return;
              uintptr_t page = (uintptr_t)g_target & ~0xFFF;
              mprotect((void*)page, 0x1000, PROT_READ | PROT_WRITE | PROT_EXEC);
              memcpy(g_target, g_original, 16);
              mprotect((void*)page, 0x1000, PROT_READ | PROT_EXEC);
              g_installed = false;
          }
          
          // --- IMGUI ---
          static bool g_menu_open = true;
          void init_imgui() {
              ImGui::CreateContext(); ImGui::GetIO().IniFilename = NULL; ImGui_ImplOpenGL3_Init("#version 300 es");
              ImGui::GetStyle().WindowRounding = 15.0f;
              ImGui::GetStyle().Colors[ImGuiCol_WindowBg] = ImVec4(0.02f, 0.02f, 0.02f, 1.0f);
              ImGui::GetStyle().Colors[ImGuiCol_Border] = ImVec4(1.0f, 0.2f, 0.2f, 1.0f);
          }
          void render_menu() {
              if (!g_menu_open) return;
              ImGui_ImplOpenGL3_NewFrame(); ImGui::NewFrame();
              ImGui::SetNextWindowSize(ImVec2(380, 500), ImGuiCond_FirstUseEver);
              ImGui::Begin("OXIDE MENU", &g_menu_open);
              ImGui::TextColored(ImVec4(0.2f, 0.6f, 1.0f, 1.0f), "t.me/game_soft_svk");
              ImGui::End(); ImGui::Render(); ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          }
          
          using EglSwapFn = EGLBoolean(*)(EGLDisplay, EGLSurface);
          static EglSwapFn orig_swap = nullptr;
          
          EGLBoolean hk_eglSwapBuffers(EGLDisplay dpy, EGLSurface surf) {
              render_menu();
              return orig_swap(dpy, surf);
          }
          
          void* thread_main(void*) {
              sleep(8); // Ждем загрузки
              init_imgui();
              
              void* libegl = dlopen("libEGL.so", RTLD_NOW);
              if (libegl) {
                  void* egl_swap = dlsym(libegl, "eglSwapBuffers");
                  if (egl_swap) {
                      orig_swap = (EglSwapFn)egl_swap;
                      if (install_hook(egl_swap, (void*)hk_eglSwapBuffers)) {
                          LOGI("Custom hook installed!");
                      } else {
                          LOGI("Hook failed!");
                      }
                  } else {
                      LOGI("Failed to find eglSwapBuffers");
                  }
              } else {
                  LOGI("Failed to load libEGL.so");
              }
              return nullptr;
          }
          
          extern "C" __attribute__((visibility("default"))) void overlay_entry() {
              pthread_t t; pthread_create(&t, nullptr, thread_main, nullptr); pthread_detach(t);
          }
          EOF
          
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(oxide_mono CXX)
          set(CMAKE_CXX_STANDARD 17)
          include_directories(${CMAKE_SOURCE_DIR}/imgui ${CMAKE_SOURCE_DIR}/imgui/backends)
          set(CMAKE_CXX_VISIBILITY_PRESET default)
          set(CMAKE_VISIBILITY_INLINES_HIDDEN OFF)
          add_library(oxide_mono SHARED main.cpp
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/backends/imgui_impl_opengl3.cpp)
          target_link_libraries(oxide_mono log EGL GLESv3 android dl)
          target_compile_options(oxide_mono PRIVATE -O3 -s)
          EOF
          
      - name: Compile
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release ..
          make -j4
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboxide_mono
          path: build/liboxide_mono.so
