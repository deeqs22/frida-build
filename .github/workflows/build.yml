name: Build Oxide Monolith (No Dobby)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Download Dependencies
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git
      - name: Create Source
        run: |
          cat > main.cpp << 'EOF'
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <android/log.h>
          #include <dlfcn.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <sys/ptrace.h>
          #include <sys/stat.h>
          #include <sys/syscall.h>
          #include <sys/mman.h>
          #include <fcntl.h>
          #include <stdarg.h>
          #include <string.h>
          #include <string>
          #include <sstream>
          #include <errno.h>
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "oxide_mono", __VA_ARGS__)
          
          // --- ЗАГЛУШКА ВМЕСТО DOBBY ---
          extern "C" int DobbyHook(void *address, void *fake_func, void **out_origin_func) {
              LOGI("DobbyHook stub called (no hook applied)");
              return 0; 
          }
          
          // --- BYPASS ---
          using PtraceFn = long(*)(int, pid_t, void*, void*); using OpenFn = int(*)(const char*, int, ...);
          using ReadFn = ssize_t(*)(int, void*, size_t);
          static PtraceFn orig_ptrace = nullptr; static OpenFn orig_open = nullptr; static ReadFn orig_read = nullptr;
          
          bool is_hidden(const char* path) {
              if (!path) return false; const char* h[] = {"su", "magisk", "kernelsu", "frida", "liboxide"};
              for (const char* x : h) if (strstr(path, x)) return true; return false;
          }
          long hk_ptrace(int req, pid_t pid, void* addr, void* data) { if (req == PTRACE_TRACEME || req == PTRACE_ATTACH) return 0; return orig_ptrace(req, pid, addr, data); }
          int hk_open(const char* path, int flags, ...) { va_list args; va_start(args, flags); int mode = va_arg(args, int); va_end(args); if (is_hidden(path)) { errno = ENOENT; return -1; } return orig_open(path, flags, mode); }
          ssize_t hk_read(int fd, void* buf, size_t count) {
              ssize_t n = orig_read(fd, buf, count); if (n <= 0) return n;
              char link[128] = {}; char p[64]; snprintf(p, sizeof(p), "/proc/self/fd/%d", fd);
              ssize_t l = readlink(p, link, sizeof(link)-1); if (l <= 0) return n; link[l] = 0;
              if (strstr(link, "/maps")) {
                  std::string in((char*)buf, n), out; std::stringstream ss(in); std::string line;
                  while (std::getline(ss, line)) { if (line.find("liboxide") == std::string::npos) out += line + "\n"; }
                  size_t c = out.size() < count ? out.size() : count; memcpy(buf, out.data(), c); return (ssize_t)c;
              } return n;
          }
          void do_bypass() {
              LOGI("Bypass initialized (stubs)");
          }
          
          // --- IMGUI ---
          static bool g_menu_open = true;
          void init_imgui() {
              ImGui::CreateContext(); ImGui::GetIO().IniFilename = NULL; ImGui_ImplOpenGL3_Init("#version 300 es");
              ImGui::GetStyle().WindowRounding = 15.0f;
              ImGui::GetStyle().Colors[ImGuiCol_WindowBg] = ImVec4(0.02f, 0.02f, 0.02f, 1.0f);
              ImGui::GetStyle().Colors[ImGuiCol_Border] = ImVec4(1.0f, 0.2f, 0.2f, 1.0f);
          }
          void render_menu() {
              if (!g_menu_open) return;
              ImGui_ImplOpenGL3_NewFrame(); ImGui::NewFrame();
              ImGui::SetNextWindowSize(ImVec2(380, 500), ImGuiCond_FirstUseEver);
              ImGui::Begin("OXIDE MENU", &g_menu_open);
              ImGui::TextColored(ImVec4(0.2f, 0.6f, 1.0f, 1.0f), "t.me/game_soft_svk");
              ImGui::End(); ImGui::Render(); ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          }
          
          void* thread_main(void*) {
              sleep(8); // Ждем загрузки
              do_bypass();
              init_imgui();
              return nullptr;
          }
          
          extern "C" __attribute__((visibility("default"))) void overlay_entry() {
              pthread_t t; pthread_create(&t, nullptr, thread_main, nullptr); pthread_detach(t);
          }
          EOF
          
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(oxide_mono CXX)
          set(CMAKE_CXX_STANDARD 17)
          include_directories(${CMAKE_SOURCE_DIR}/imgui ${CMAKE_SOURCE_DIR}/imgui/backends)
          set(CMAKE_CXX_VISIBILITY_PRESET default)
          set(CMAKE_VISIBILITY_INLINES_HIDDEN OFF)
          add_library(oxide_mono SHARED main.cpp
              imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/backends/imgui_impl_opengl3.cpp)
          target_link_libraries(oxide_mono log EGL GLESv3 android dl)
          target_compile_options(oxide_mono PRIVATE -O3 -s)
          EOF
          
      - name: Compile
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release ..
          make -j4
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboxide_mono
          path: build/liboxide_mono.so
