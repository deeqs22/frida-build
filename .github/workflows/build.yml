name: Build Oxide Full Cheat
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Download ImGui & Dobby
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git
          git clone --depth 1 https://github.com/jmpews/Dobby.git
      - name: Create Source Files
        run: |
          mkdir -p src
          
          cat > src/anti_bypass.cpp << 'EOF'
          #include <dlfcn.h>
          #include <sys/ptrace.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <stdarg.h>
          #include <string.h>
          #include <errno.h>
          #include "dobby.h"
          
          namespace bypass {
              using PtraceFn = long(*)(int, pid_t, void*, void*);
              using OpenFn = int(*)(const char*, int, ...);
              using StatFn = int(*)(const char*, struct stat*);
              using AccessFn = int(*)(const char*, int);
              static PtraceFn orig_ptrace = nullptr;
              static OpenFn orig_open = nullptr;
              static StatFn orig_stat = nullptr;
              static AccessFn orig_access = nullptr;
              
              bool is_hidden_path(const char* path) {
                  if (!path) return false;
                  const char* hidden[] = {"su", "magisk", "kernelsu", "supersu", "busybox", "frida", "xposed", "substrate", "liboxide_cheat"};
                  for (const char* h : hidden) if (strstr(path, h)) return true;
                  return false;
              }
              long hk_ptrace(int req, pid_t pid, void* addr, void* data) {
                  if (req == PTRACE_TRACEME || req == PTRACE_ATTACH) return 0;
                  return orig_ptrace(req, pid, addr, data);
              }
              int hk_open(const char* path, int flags, ...) {
                  va_list args; va_start(args, flags); int mode = va_arg(args, int); va_end(args);
                  if (is_hidden_path(path)) { errno = ENOENT; return -1; }
                  return orig_open(path, flags, mode);
              }
              int hk_stat(const char* path, struct stat* buf) {
                  if (is_hidden_path(path)) { errno = ENOENT; return -1; }
                  return orig_stat(path, buf);
              }
              int hk_access(const char* path, int mode) {
                  if (is_hidden_path(path)) { errno = ENOENT; return -1; }
                  return orig_access(path, mode);
              }
              void init() {
                  void* libc = dlopen("libc.so", RTLD_NOW);
                  if (!libc) return;
                  orig_ptrace = (PtraceFn)dlsym(libc, "ptrace");
                  orig_open = (OpenFn)dlsym(libc, "open");
                  orig_stat = (StatFn)dlsym(libc, "stat");
                  orig_access = (AccessFn)dlsym(libc, "access");
                  if (orig_ptrace) DobbyHook((void*)orig_ptrace, (void*)hk_ptrace, (void**)&orig_ptrace);
                  if (orig_open) DobbyHook((void*)orig_open, (void*)hk_open, (void**)&orig_open);
                  if (orig_stat) DobbyHook((void*)orig_stat, (void*)hk_stat, (void**)&orig_stat);
                  if (orig_access) DobbyHook((void*)orig_access, (void*)hk_access, (void**)&orig_access);
              }
          }
          EOF
          
          cat > src/main.cpp << 'EOF'
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <android/log.h>
          #include <dlfcn.h>
          #include "imgui.h"
          #include "imgui_impl_opengl3.h"
          #include "dobby.h"
          
          extern void bypass_init();
          
          static bool g_menu_open = true;
          static bool g_aim = true;
          static bool g_silent = true;
          static float g_fov = 15.0f;
          static bool g_esp = true;
          static bool g_norecoil = false;
          
          void init_imgui() {
              ImGui::CreateContext();
              ImGui::GetIO().IniFilename = NULL;
              ImGui_ImplOpenGL3_Init("#version 300 es");
              ImGuiStyle& style = ImGui::GetStyle();
              style.WindowRounding = 15.0f;
              style.FrameRounding = 10.0f;
              style.Colors[ImGuiCol_WindowBg] = ImVec4(0.02f, 0.02f, 0.02f, 1.0f);
              style.Colors[ImGuiCol_Border] = ImVec4(1.0f, 0.2f, 0.2f, 1.0f);
              style.Colors[ImGuiCol_CheckMark] = ImVec4(1.0f, 0.2f, 0.2f, 1.0f);
          }
          
          void render_menu() {
              if (!g_menu_open) return;
              ImGui_ImplOpenGL3_NewFrame();
              ImGui::NewFrame();
              ImGui::SetNextWindowSize(ImVec2(380, 500), ImGuiCond_FirstUseEver);
              ImGui::Begin("OXIDE MENU", &g_menu_open, ImGuiWindowFlags_NoCollapse);
              ImGui::TextColored(ImVec4(0.2f, 0.6f, 1.0f, 1.0f), "t.me/game_soft_svk");
              ImGui::Separator();
              if (ImGui::BeginTabBar("MainTabs")) {
                  if (ImGui::BeginTabItem("AIM")) {
                      ImGui::TextColored(ImVec4(1,0,0,1), "COMBAT");
                      ImGui::Checkbox("Aimbot", &g_aim);
                      ImGui::SliderFloat("FOV", &g_fov, 1.0f, 180.0f, "%.0f deg");
                      ImGui::Checkbox("Silent Aim", &g_silent);
                      ImGui::EndTabItem();
                  }
                  if (ImGui::BeginTabItem("ESP")) {
                      ImGui::TextColored(ImVec4(1,0,0,1), "PLAYER ESP");
                      ImGui::Checkbox("Enable ESP", &g_esp);
                      ImGui::EndTabItem();
                  }
                  if (ImGui::BeginTabItem("MISC")) {
                      ImGui::TextColored(ImVec4(1,0,0,1), "WEAPON");
                      ImGui::Checkbox("No Recoil", &g_norecoil);
                      ImGui::EndTabItem();
                  }
                  ImGui::EndTabBar();
              }
              ImGui::End();
              ImGui::Render();
              ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
          }
          
          using EglSwapFn = EGLBoolean(*)(EGLDisplay, EGLSurface);
          static EglSwapFn orig_swap = nullptr;
          EGLBoolean hk_eglSwapBuffers(EGLDisplay dpy, EGLSurface surf) {
              static bool init = false;
              if (!init) { bypass::init(); init_imgui(); init = true; }
              render_menu();
              return orig_swap(dpy, surf);
          }
          
          extern "C" void overlay_entry() {
              void* libegl = dlopen("libEGL.so", RTLD_NOW);
              if (libegl) {
                  orig_swap = (EglSwapFn)dlsym(libegl, "eglSwapBuffers");
                  DobbyHook((void*)orig_swap, (void*)hk_eglSwapBuffers, (void**)&orig_swap);
              }
          }
          EOF
          
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18)
          project(oxide_cheat CXX)
          set(CMAKE_CXX_STANDARD 17)
          include_directories(${CMAKE_SOURCE_DIR}/imgui ${CMAKE_SOURCE_DIR}/imgui/backends ${CMAKE_SOURCE_DIR}/Dobby/include)
          add_library(oxide_cheat SHARED
              src/main.cpp
              src/anti_bypass.cpp
              imgui/imgui.cpp
              imgui/imgui_draw.cpp
              imgui/imgui_tables.cpp
              imgui/imgui_widgets.cpp
              imgui/backends/imgui_impl_opengl3.cpp
          )
          target_link_libraries(oxide_cheat log EGL GLESv3 android dl)
          EOF
          
      - name: Compile
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j4
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: liboxide_cheat
          path: build/liboxide_cheat.so
