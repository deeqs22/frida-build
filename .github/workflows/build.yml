name: Build Zygisk Injector
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
      - name: Create Zygisk Header
        run: |
          mkdir -p zygisk
          cat > zygisk/zygisk.hpp << 'EOF'
          #pragma once
          #include <jni.h>
          #include <string>
          #include <sys/types.h>

          namespace zygisk {
              struct AppSpecializeArgs {
                  jstring *nice_name;
                  void *args; 
              };

              struct Api {
                  void *impl;
                  void (*setOption)(Api*, int);
                  int (*getModuleDir)(Api*);
                  void (*hookJniNativeMethods)(Api*, const char*, const char*, void*, int);
                  void (*pltHookRegister)(Api*, void*, void*, void**);
                  void (*pltHookCommit)(Api*);
                  void (*exemptFd)(Api*, int);
              };

              class ModuleBase {
              public:
                  virtual void onLoad(Api *api, JNIEnv *env) {}
                  virtual void preAppSpecialize(AppSpecializeArgs *args) {}
                  virtual void postAppSpecialize(const AppSpecializeArgs *args) {}
                  virtual void preServerSpecialize(AppSpecializeArgs *args) {}
                  virtual void postServerSpecialize(const AppSpecializeArgs *args) {}
                  virtual ~ModuleBase() = default;
              };

              void registerModule(ModuleBase *module);
              void unregisterModule();
          }

          #define REGISTER_ZYGISK_MODULE(clazz) \
          extern "C" [[gnu::visibility("default")]] void zygisk_module_entry(zygisk::Api *api, JNIEnv *env) { \
              static clazz module; \
              module.onLoad(api, env); \
              zygisk::registerModule(&module); \
          }
          EOF
      - name: Create Injector Code
        run: |
          cat > module.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <unistd.h>
          #include <pthread.h>
          #include <dlfcn.h>
          #include <android/log.h>
          #include "zygisk.hpp"

          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "deeqs_inject", __VA_ARGS__)

          static const char* kPkg = "com.netease.newspike";
          static const char* kSo = "/data/adb/modules/deeqs_cheat/system/lib64/libdeeqs_cheat.so";

          class Injector : public zygisk::ModuleBase {
          public:
              void onLoad(zygisk::Api* api, JNIEnv* env) override { this->api = api; this->env = env; }
              void postAppSpecialize(const zygisk::AppSpecializeArgs* args) override {
                  const char* pkg = env->GetStringUTFChars(*args->nice_name, nullptr);
                  if (pkg && strcmp(pkg, kPkg) == 0) {
                      env->ReleaseStringUTFChars(*args->nice_name, pkg);
                      pthread_t thread;
                      pthread_create(&thread, nullptr, inject_thread, this);
                      pthread_detach(thread);
                  }
              }
          private:
              static void* inject_thread(void* arg) {
                  sleep(3); 
                  void* h = dlopen(kSo, RTLD_NOW);
                  if (h) {
                      auto entry = (void(*)())dlsym(h, "overlay_entry");
                      if (entry) {
                          LOGI("Injecting overlay_entry...");
                          entry();
                      }
                  } else {
                      LOGI("Failed to dlopen cheat: %s", dlerror());
                  }
                  return nullptr;
              }
              zygisk::Api* api = nullptr;
              JNIEnv* env = nullptr;
          };

          REGISTER_ZYGISK_MODULE(Injector)
          EOF
      - name: Create Android.mk
        run: |
          cat > Android.mk << 'EOF'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_MODULE := arm64-v8a
          LOCAL_SRC_FILES := module.cpp
          LOCAL_CPPFLAGS := -std=c++17 -O2 -fvisibility=hidden -I$(LOCAL_PATH)/zygisk
          LOCAL_LDLIBS := -llog -ldl
          LOCAL_LDFLAGS := -Wl,-z,max-page-size=0x4000
          include $(BUILD_SHARED_LIBRARY)
          EOF
      - name: Create Application.mk
        run: |
          cat > Application.mk << 'EOF'
          APP_ABI := arm64-v8a
          APP_PLATFORM := android-30
          APP_STL := c++_static
          EOF
      - name: Compile Injector
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk_injector
          path: libs/arm64-v8a/arm64-v8a.so
